name: Build Desktop Application (Electron)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    # Note: 'contents: write' is required for electron-builder to create GitHub Releases and upload release binaries.
    # If this workflow is ever triggered from a fork or pull_request, GITHUB_TOKEN is restricted to read-only
    # by GitHub security policy; publishing from a fork requires a custom PAT.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # NOTE (048-desktop-tts-migration): verify this is still the right pin
          # for `vieneu` when bumping - tested locally on 3.12 with no issues,
          # but this project's CI/setup scripts had stayed on 3.10 since the
          # RVC/fairseq days and that constraint no longer applies.

      - name: Create Python virtual environment
        run: python -m venv python-backend/venv
        shell: cmd

      - name: Install backend dependencies
        run: python-backend\venv\Scripts\pip.exe install -r python-backend\requirements.txt
        shell: cmd

      - name: Make Python venv relocatable / standalone
        run: python scripts/bundle-venv.py
        shell: cmd

      - name: Package Desktop Installer (Electron Builder)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxread-windows-installer
          path: release/*.exe
          if-no-files-found: warn
