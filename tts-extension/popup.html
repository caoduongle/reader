<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>AI Đọc Truyện</title>
<style>
  body {
    width: 300px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    background: #fff;
    color: #1a1a1a;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin: 10px 0 4px;
    color: #555;
  }
  input[type="password"], input[type="text"], select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  #save { background: #f0f0f0; color: #333; }
  #start { background: #7c3aed; color: #fff; }
  #start:hover { background: #6d28d9; }
  #save:hover { background: #e4e4e4; }
  .hint {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
    line-height: 1.4;
  }
  .hint a { color: #7c3aed; }
  #status { font-size: 11px; margin-top: 8px; color: #16a34a; min-height: 14px; }
</style>
</head>
<body>
  <h1>🔊 AI Đọc Truyện (Gemini TTS)</h1>

  <label for="provider">Nguồn giọng đọc</label>
  <select id="provider">
    <option value="gemini">Gemini AI (giọng có sẵn)</option>
    <option value="local">Giọng của tôi (server local)</option>
  </select>

  <label for="apiKey">Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="Dán API key từ Google AI Studio" />
  <div class="hint">Lấy key miễn phí tại <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></div>

  <div class="row">
    <div>
      <label for="voice">Giọng đọc</label>
      <select id="voice">
        <option value="Kore">Kore (Nữ, ấm)</option>
        <option value="Puck">Puck (Nam, trẻ)</option>
        <option value="Charon">Charon (Nam, trầm)</option>
        <option value="Zephyr">Zephyr (Nữ, nhẹ)</option>
        <option value="Fenrir">Fenrir (Nam, mạnh)</option>
        <option value="Leda">Leda (Nữ, trẻ)</option>
        <option value="Orus">Orus (Nam, chững chạc)</option>
        <option value="Aoede">Aoede (Nữ, du dương)</option>
      </select>
    </div>
    <div>
      <label for="rate">Tốc độ</label>
      <select id="rate">
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>
  </div>

  <button id="save">Lưu cài đặt</button>
  <button id="start">▶ Bắt đầu đọc trang này</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
