name: Security Audit & Vulnerability Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly security scan on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

jobs:
  audit-dependencies:
    name: Dependency Vulnerability Audit (FR-020)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

      - name: Run Vitest Security Test Suite
        run: npm run test
